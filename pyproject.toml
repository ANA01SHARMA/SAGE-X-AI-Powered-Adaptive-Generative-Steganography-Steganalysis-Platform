[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sagex"
version = "0.1.0"
description = "Encrypted data hidden inside images, with an honest capacity check"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.11",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sagex = "sagex.cli:main"
sagex-web = "sagex.web.app:main"

[tool.setuptools.packages.find]
include = ["sagex*"]

[tool.setuptools.package-data]
"sagex.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
